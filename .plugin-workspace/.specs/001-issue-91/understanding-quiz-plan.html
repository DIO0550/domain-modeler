<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>実装前 理解度クイズ — エラー回復パーサーの回帰テスト</title>
<style>
:root {
  --bg: oklch(0.985 0.003 255);
  --surface: #ffffff;
  --surface-2: oklch(0.978 0.004 255);
  --surface-3: oklch(0.965 0.005 255);
  --border: oklch(0.925 0.005 255);
  --border-strong: oklch(0.875 0.007 255);
  --text: oklch(0.28 0.012 262);
  --text-2: oklch(0.52 0.012 262);
  --text-25: oklch(0.45 0.012 262);
  --text-3: oklch(0.65 0.011 262);
  --text-4: oklch(0.75 0.011 262);
  --accent: oklch(0.55 0.16 264);
  --accent-2: oklch(0.5 0.16 264);
  --accent-soft: oklch(0.955 0.025 264);
  --accent-soft-2: oklch(0.93 0.04 264);
  --accent-border: oklch(0.86 0.06 264);
  --green: oklch(0.5 0.11 156);
  --green-soft: oklch(0.955 0.04 156);
  --green-border: oklch(0.85 0.07 156);
  --rose: oklch(0.54 0.16 22);
  --rose-soft: oklch(0.957 0.03 22);
  --rose-border: oklch(0.87 0.06 22);
  --amber: oklch(0.52 0.1 72);
  --amber-soft: oklch(0.955 0.05 82);
  --amber-border: oklch(0.85 0.08 82);
  --r-sm: 6px; --r-md: 9px; --r-lg: 13px;
  --shadow-sm: 0 1px 2px oklch(0.4 0.02 262 / 0.05);
  --shadow-md: 0 4px 14px oklch(0.4 0.02 262 / 0.08), 0 1px 3px oklch(0.4 0.02 262 / 0.05);
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Noto Sans JP", system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14.5px; line-height: 1.7; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 820px; margin: 0 auto; padding: 40px 24px 96px; }
button { font-family: inherit; }

/* ---- Header ---- */
.hero {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
  padding: 26px 28px; margin-bottom: 18px;
}
.hero .kind {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--accent-2); background: var(--accent-soft);
  border: 1px solid var(--accent-border); padding: 3px 10px; border-radius: 20px;
}
.hero .kind::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.hero h1 { font-size: 25px; font-weight: 700; letter-spacing: -0.01em; margin: 13px 0 8px; line-height: 1.3; }
.hero .intro { font-size: 14.5px; color: var(--text-2); line-height: 1.75; max-width: 680px; }
.hero .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 15px; }
.hero .src { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); background: var(--surface-3); border: 1px solid var(--border); padding: 2px 9px; border-radius: 5px; }
.hero .advisory {
  margin-top: 16px; display: flex; gap: 11px; align-items: flex-start;
  background: var(--amber-soft); border: 1px solid var(--amber-border);
  border-radius: var(--r-md); padding: 11px 14px; font-size: 12.5px; color: var(--text-2); line-height: 1.6;
}
.hero .advisory b { color: var(--text); }

/* ---- クイズ pane ---- */
.quiz-wrap { display: flex; flex-direction: column; gap: 34px; }
.q-section { display: flex; flex-direction: column; gap: 13px; }
.q-section .qs-head { display: flex; align-items: baseline; gap: 11px; }
.q-section .qs-n { font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--accent-2); }
.q-section h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.015em; }
.q-section .qs-brief { border-left: 3px solid var(--accent-border); background: var(--surface); border-radius: 0 10px 10px 0; padding: 13px 17px; font-size: 13.5px; line-height: 1.8; color: var(--text-25); }
.q { background: var(--surface); border-radius: 13px; padding: 20px 22px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.q.correct { border-color: var(--green-border); }
.q.wrong { border-color: var(--rose-border); }
.q .q-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.q .q-id { font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--text-3); }
.q .q-type { font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; padding: 2px 9px; border-radius: 20px; color: var(--accent-2); background: var(--accent-soft); border: 1px solid var(--accent-border); }
.q .q-mark { margin-left: auto; font-size: 11.5px; font-weight: 700; }
.q .q-mark.ok { color: var(--green); }
.q .q-mark.ng { color: var(--rose); }
.q .q-prompt { font-size: 15.5px; font-weight: 600; line-height: 1.65; margin-top: 9px; }
.q .q-intent { font-size: 12px; color: var(--text-3); margin-top: 5px; }
.q .q-intent::before { content: "◎ 意図: "; }
.q .rows { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.row { display: flex; align-items: center; gap: 11px; border-radius: 9px; padding: 12px 14px; font-size: 14px; border: 1px solid var(--border-strong); background: var(--surface); }
.row .rw-badge { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11.5px; font-weight: 700; background: var(--surface-3); border: 1px solid var(--border); color: var(--text-2); }
.row .rw-text { flex: 1; line-height: 1.6; }
.row .rw-grip { flex: 0 0 auto; color: var(--text-4); font-size: 13px; letter-spacing: -1px; cursor: grab; }
.row .rw-mark { flex: 0 0 auto; font-size: 12px; font-weight: 700; display: none; }
.row .rw-move { display: flex; gap: 4px; flex: 0 0 auto; }
.row .rw-move button { border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2); width: 26px; height: 26px; border-radius: 6px; cursor: pointer; }
.row.pickable { cursor: pointer; }
.q:not(.done) .row.pickable:hover { background: var(--surface-2); }
.row.bool .rw-text { font-weight: 700; }
.row.is-answer { border-color: var(--green-border); background: var(--green-soft); }
.row.is-answer .rw-mark { display: inline; color: var(--green); }
.row.is-picked-wrong { border-color: var(--rose-border); background: var(--rose-soft); }
.row.is-picked-wrong .rw-mark { display: inline; color: var(--rose); }
.q.done .row:not(.is-answer):not(.is-picked-wrong):not(.correct-pos):not(.wrong-pos) { opacity: 0.5; }
.row.order { cursor: grab; user-select: none; }
.row.order.drag-over { outline: 2px solid var(--accent); outline-offset: -1px; }
.row.order.drag-src { opacity: 0.45; }
.row.correct-pos { border-color: var(--green-border); background: var(--green-soft); }
.row.wrong-pos { border-color: var(--rose-border); background: var(--rose-soft); }
.order-confirm-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.order-confirm-row .oc-hint { font-size: 11.5px; color: var(--text-3); }
.order-confirm-row .oc-sp { flex: 1; }
.order-confirm-row button { font-size: 13.5px; font-weight: 600; border: 1px solid var(--border-strong); background: var(--surface); padding: 9px 16px; border-radius: 7px; cursor: pointer; }
.order-ref { margin-top: 11px; background: var(--green-soft); border: 1px solid var(--green-border); border-radius: 9px; padding: 12px 15px; display: flex; flex-direction: column; gap: 4px; }
.order-ref .or-head { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); }
.order-ref .or-item { display: flex; gap: 11px; font-size: 13.5px; line-height: 1.7; color: oklch(0.35 0.012 262); }
.order-ref .or-item .or-n { flex: 0 0 auto; font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--green); width: 16px; }
.q .explain { display: none; margin-top: 14px; border-top: 1px dashed var(--border-strong); padding-top: 13px; flex-direction: column; gap: 5px; }
.q.done .explain { display: flex; }
.q .explain .el { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-2); }
.q .explain .et { font-size: 13.5px; line-height: 1.85; color: var(--text-25); }

/* ---- verdict / actions ---- */
.verdict { display: none; border-radius: 11px; padding: 16px 19px; font-size: 14px; line-height: 1.75; margin-top: 6px; }
.verdict.show { display: block; }
.verdict.pass { background: var(--green-soft); border: 1px solid var(--green-border); }
.verdict.fail { background: var(--rose-soft); border: 1px solid var(--rose-border); }
.actions { position: sticky; bottom: 14px; display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 13px; box-shadow: var(--shadow-md); padding: 15px 20px; }
.actions .progress-lbl { font-size: 13px; color: var(--text-2); }
.actions .reset { font-size: 13.5px; font-weight: 600; border: 1px solid var(--border-strong); background: var(--surface); padding: 9px 16px; border-radius: 7px; cursor: pointer; }
.actions .score { margin-left: auto; text-align: right; }
.actions .score .num { font-family: var(--mono); font-size: 22px; font-weight: 700; line-height: 1.1; }
.actions .score .num.pass { color: var(--green); }
.actions .score .num.fail { color: var(--rose); }
.actions .score .lbl { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero" id="hero"></header>
  <div class="quiz-wrap">
    <div id="quiz-sections"></div>
    <div class="verdict" id="verdict"></div>
    <div class="actions">
      <div class="progress-lbl" id="progress-lbl">未回答</div>
      <button class="reset" id="reset">リセット</button>
      <div class="score"><div class="num" id="score-num">—</div><div class="lbl">スコア</div></div>
    </div>
  </div>
</div>

const QUIZ = {

  },

        },
        {

          type: "boolean",
          prompt: "正常な宣言だけがASTに残れば、ErrorDeclが欠落していても今回の成功条件を満たす。",
          intent: "正常ASTの保持だけでなく不正宣言の表現も契約に含むことを確認する",
          answer: false,
          explain: "成功条件には後続の正常宣言の保持に加え、不正宣言をErrorDeclとして位置付きで返すことが含まれます。正常宣言だけのASTではUC-2と確定済みの公開契約を満たしません。",

    {

      brief: "解析は宣言先頭のdataまたはworkflowを同期点としてチャンクを分け、各チャンクの成否を独立に結果へ反映します。これにより、一つの失敗で文書全体を打ち切りません。",
      questions: [
        {
          id: "Q3",
          type: "order",
          prompt: "ソースから最終的な解析結果を得るまでの処理を正しい順に並べてください。",
          intent: "宣言境界で回復するデータフローの理解を確認する",
          items: [
            "ソースをトークン列へ変換する",

      brief: "探索の結果、宣言境界から解析を再開する仕組みは既に存在します。そのため今回は公開APIを通した専用回帰テストで契約を固定し、プロダクションコードや外部依存を増やしません。",
      questions: [
        {
          id: "Q5",
          type: "choice",

          intent: "入力末尾を不要な次宣言やフォールバックに依存せず扱う意図を確認する",
          options: [
            "次の同期点がないため解析結果全体を返さない",
            "末尾の不正宣言を無視し、それ以前の正常宣言だけを返す",

            "末尾の不正宣言をErrorDeclにし、対応するdiagnosticとともに返す",
          ],

          explain: "UC-2は、最終宣言が不正でもErrorDeclとdiagnosticを返すことを成功条件にしています。次の同期点を要求したり、宣言を黙って捨てたり、自動補完するフォールバックは計画にありません。",
        },

          intent: "既存実装を再利用し回帰テストに変更を限定する判断を確認する",

          explain: "計画は既存回復実装の再利用を明示し、新規ファイルを専用回帰テストだけに限定しています。重複実装は線形特性や既存契約を崩すリスクを増やし、今回の不足である契約の固定にも不要です。",

<!-- ===== 以下 レンダラ / 採点ロジックは固定。編集しない ===== -->
<script>
(function () {
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const rich = (s) => esc(s)
    .replace(/&lt;b&gt;/g, "<b>").replace(/&lt;\/b&gt;/g, "</b>")
    .replace(/&lt;code&gt;/g, "<code>").replace(/&lt;\/code&gt;/g, "</code>");
  const TYPE_LABEL = { choice: "4択", boolean: "YES / NO", order: "並べ替え" };
  const passLine = QUIZ.meta.passLine == null ? 0.8 : QUIZ.meta.passLine;

  const Q = [];
  QUIZ.sections.forEach((sec) => sec.questions.forEach((q) => Q.push(q)));

  // 状態: 初回回答で確定・ロック。orders は order 設問の表示順（src インデックス列）
  let results = {};
  let picks = {};
  let orders = {};
  let drag = null;

  function shuffle(n) {
    const a = Array.from({ length: n }, (_, i) => i);
    if (n < 2) return a;
    do {
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    } while (a.every((v, i) => v === i));
    return a;
  }
  function initOrders() {
    orders = {};
    Q.forEach((q) => { if (q.type === "order") orders[q.id] = shuffle(q.items.length); });
  }

  // ---- render hero ----
  function renderHero() {
    const m = QUIZ.meta;
    const src = (m.sources || []).map((s) => `<span class="src">${esc(s)}</span>`).join("");
    document.getElementById("hero").innerHTML = `
      <span class="kind">実装前クイズ · Plan → Impl ゲート</span>
      <h1>${esc(m.title)}</h1>
      <p class="intro">${rich(m.intro)}</p>
      <div class="sources">${src}</div>
      <div class="advisory">
        <div><b>これは advisory ゲートです。</b>合否は自己申告で、機械的なブロックはしません。
        各設問は<b>回答した時点で正誤と解説が表示され、答えは変更できません</b>。
        合否は初回の通し回答で判断してください（リセットは解説を読んだ後の再学習用です）。
        落ちた設問がある＝設計がまだ自分の中で固まっていない箇所なので、<b>実装を始める前に</b>計画を見直してください。</div>
      </div>`;
  }

  // ---- render クイズ ----
  function renderQuiz() {
    const secs = QUIZ.sections || [];
    document.getElementById("quiz-sections").innerHTML = secs.map((sec, si) => `
      <section class="q-section">
        <div class="qs-head"><span class="qs-n">SECTION ${si + 1}</span><h2>${esc(sec.title)}</h2></div>
        ${sec.brief ? `<div class="qs-brief">${rich(sec.brief)}</div>` : ""}
        ${sec.questions.map(renderQ).join("")}
      </section>`).join("");
    wire();
    updateProgress();
  }

  function renderQ(q) {
    const done = q.id in results;
    const ok = results[q.id];
    let rows = "";
    let tail = "";
    if (q.type === "choice") {
      rows = q.options.map((o, i) => {
        const isAns = done && i === q.answer;
        const wrong = done && !ok && picks[q.id] === i;
        return `<div class="row pickable ${isAns ? "is-answer" : ""} ${wrong ? "is-picked-wrong" : ""}" data-qid="${q.id}" data-i="${i}">
          <span class="rw-badge">${"ABCDE"[i] || i + 1}</span><span class="rw-text">${esc(o)}</span>
          <span class="rw-mark">${isAns ? "✓ 正解" : "✕"}</span>
        </div>`;
      }).join("");
    } else if (q.type === "boolean") {
      rows = [true, false].map((v) => {
        const isAns = done && v === q.answer;
        const wrong = done && !ok && picks[q.id] === v;
        return `<div class="row pickable bool ${isAns ? "is-answer" : ""} ${wrong ? "is-picked-wrong" : ""}" data-qid="${q.id}" data-v="${v}">
          <span class="rw-badge">${v ? "Y" : "N"}</span><span class="rw-text">${v ? "YES" : "NO"}</span>
          <span class="rw-mark">${isAns ? "✓ 正解" : "✕"}</span>
        </div>`;
      }).join("");
    } else if (q.type === "order") {
      const ord = orders[q.id] || q.items.map((_, i) => i);
      rows = ord.map((src, pos) => {
        const cls = done ? (src === pos ? "correct-pos" : "wrong-pos") : "order";
        return `<div class="row ${cls}" data-qid="${q.id}" data-pos="${pos}" ${done ? "" : 'draggable="true"'}>
          ${done ? "" : `<span class="rw-grip">⠿</span>`}
          <span class="rw-badge">${pos + 1}</span><span class="rw-text">${esc(q.items[src])}</span>
          ${done ? "" : `<span class="rw-move"><button class="mv-up" title="上へ">▲</button><button class="mv-down" title="下へ">▼</button></span>`}
        </div>`;
      }).join("");
      if (!done) {
        tail += `<div class="order-confirm-row"><span class="oc-hint">ドラッグ、または ▲▼ で並べ替え</span><span class="oc-sp"></span><button class="order-confirm" data-qid="${q.id}">この順で回答する</button></div>`;
      } else if (!ok) {
        tail += `<div class="order-ref"><div class="or-head">✓ 正解の順序</div>${q.items.map((t, i) =>
          `<div class="or-item"><span class="or-n">${i + 1}</span><span>${esc(t)}</span></div>`).join("")}</div>`;
      }
    }
    return `<div class="q ${done ? "done " + (ok ? "correct" : "wrong") : ""}" id="q-${q.id}">
      <div class="q-head">
        <span class="q-id">${esc(q.id)}</span>
        <span class="q-type">${TYPE_LABEL[q.type]}</span>
        <span class="q-mark ${done ? (ok ? "ok" : "ng") : ""}">${done ? (ok ? "正解" : "不正解") : ""}</span>
      </div>
      <div class="q-prompt">${esc(q.prompt)}</div>
      ${q.intent ? `<div class="q-intent">${esc(q.intent)}</div>` : ""}
      <div class="rows">${rows}</div>
      ${tail}
      <div class="explain"><div class="el">解説</div><div class="et">${rich(q.explain)}</div></div>
    </div>`;
  }

  function answer(q, ok) {
    if (q.id in results) return;
    results[q.id] = ok;
    renderQuiz();
    if (Object.keys(results).length === Q.length) showVerdict();
  }

  function wire() {
    document.querySelectorAll(".row.pickable").forEach((r) => {
      const q = Q.find((x) => x.id === r.dataset.qid);
      if (!q || q.id in results) return;
      r.addEventListener("click", () => {
        if (q.type === "choice") { picks[q.id] = +r.dataset.i; answer(q, +r.dataset.i === q.answer); }
        else { const v = r.dataset.v === "true"; picks[q.id] = v; answer(q, v === q.answer); }
      });
    });
    document.querySelectorAll(".order-confirm").forEach((b) => {
      b.addEventListener("click", () => {
        const q = Q.find((x) => x.id === b.dataset.qid);
        if (q) answer(q, (orders[q.id] || []).every((v, i) => v === i));
      });
    });
    document.querySelectorAll(".row.order").forEach((r) => {
      const qid = r.dataset.qid, pos = +r.dataset.pos;
      r.querySelector(".mv-up").addEventListener("click", (e) => { e.stopPropagation(); moveOrder(qid, pos, -1); });
      r.querySelector(".mv-down").addEventListener("click", (e) => { e.stopPropagation(); moveOrder(qid, pos, 1); });
      r.addEventListener("dragstart", (e) => { if (e.dataTransfer) e.dataTransfer.effectAllowed = "move"; drag = { qid, from: pos }; r.classList.add("drag-src"); });
      r.addEventListener("dragover", (e) => {
        if (!drag || drag.qid !== qid) return;
        e.preventDefault();
        document.querySelectorAll(`.row.order[data-qid="${qid}"]`).forEach((el) => el.classList.remove("drag-over"));
        if (+r.dataset.pos !== drag.from) r.classList.add("drag-over");
      });
      r.addEventListener("drop", (e) => {
        e.preventDefault();
        if (drag && drag.qid === qid) moveOrderTo(qid, drag.from, pos);
        drag = null;
      });
      r.addEventListener("dragend", () => {
        drag = null;
        document.querySelectorAll(".row.order").forEach((el) => el.classList.remove("drag-over", "drag-src"));
      });
    });
  }

  function moveOrder(qid, pos, dir) {
    const cur = (orders[qid] || []).slice();
    const to = pos + dir;
    if (to < 0 || to >= cur.length) return;
    [cur[pos], cur[to]] = [cur[to], cur[pos]];
    orders[qid] = cur;
    renderQuiz();
  }
  function moveOrderTo(qid, from, to) {
    const cur = (orders[qid] || []).slice();
    if (from === to || from < 0 || to < 0 || from >= cur.length || to >= cur.length) return;
    const [x] = cur.splice(from, 1);
    cur.splice(to, 0, x);
    orders[qid] = cur;
    renderQuiz();
  }

  function updateProgress() {
    const answered = Object.keys(results).length;
    const correct = Object.values(results).filter(Boolean).length;
    document.getElementById("score-num").textContent = answered ? `${correct}/${Q.length}` : "—";
    document.getElementById("progress-lbl").textContent =
      answered === 0 ? `全 ${Q.length} 問 / 未回答` : (answered === Q.length ? "全問回答済み" : `残り ${Q.length - answered} 問`);
  }

  function showVerdict() {
    const total = Q.length;
    const correct = Object.values(results).filter(Boolean).length;
    const ratio = total ? correct / total : 0;
    const pass = ratio >= passLine;
    const numEl = document.getElementById("score-num");
    numEl.className = "num " + (pass ? "pass" : "fail");
    const v = document.getElementById("verdict");
    v.className = "verdict show " + (pass ? "pass" : "fail");
    v.innerHTML = pass
      ? `<b>合格 (${Math.round(ratio * 100)}%)</b> — 設計の意図を自分の言葉で説明できています。実装セッションに進んでよいでしょう。間違えた設問があれば、その箇所だけ計画を読み直してください。`
      : `<b>不合格 (${Math.round(ratio * 100)}% / 合格ライン ${Math.round(passLine * 100)}%)</b> — 赤い設問は設計がまだ固まっていない箇所です。実装を始める前に、その論点を計画・要件で詰め直すことをおすすめします。`;
    v.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  // リセットは解説を読んだ後の再学習用。合否は初回の通し回答で判断する
  document.getElementById("reset").addEventListener("click", () => {
    results = {}; picks = {}; initOrders();
    document.getElementById("verdict").className = "verdict";
    document.getElementById("score-num").className = "num";
    renderQuiz();
  });

  renderHero();
  initOrders();
  renderQuiz();
})();
</script>
</body>
</html>
